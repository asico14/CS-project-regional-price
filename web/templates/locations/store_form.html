{% extends "base.html" %}
{% block title %}{% if object %}Edit store{% else %}Add store{% endif %}{% endblock %}
{% block content %}
<h1>{% if object %}Edit store{% else %}Add store{% endif %}</h1>
<form method="post" class="form">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Save</button>
  <a class="button secondary" href="{% url 'store_list' %}">Cancel</a>
</form>
{% endblock %}
