{% if is_paginated %}
<nav class="pagination" aria-label="Pages">
  {% if page_obj.has_previous %}<a class="btn" href="?{% if filter_params %}{{ filter_params }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">← Previous</a>{% endif %}
  <span class="muted">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }} · {{ page_obj.paginator.count }} total</span>
  {% if page_obj.has_next %}<a class="btn" href="?{% if filter_params %}{{ filter_params }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Next →</a>{% endif %}
</nav>
{% endif %}
