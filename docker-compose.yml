# Two services sharing one SQLite database through the "data" volume:
#   web    - Django admin / site (http://localhost:8000)
#   worker - Telegram bot (python-telegram-bot, long polling)

services:
  web:
    build: ./web
    env_file: .env
    environment:
      DATABASE_PATH: /data/db.sqlite3
      MEDIA_ROOT: /data/media
    volumes:
      - data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    # Built from the repository root: the worker uses the Django code in web/.
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_PATH: /data/db.sqlite3
      MEDIA_ROOT: /data/media
    volumes:
      - data:/data
    # Start only after the web service has migrated the database.
    depends_on:
      web:
        condition: service_healthy
    # Start again after a crash. With no token set the worker exits
    # normally (code 0), so it is not restarted in a loop.
    restart: on-failure

volumes:
  data:
